 return tbl('Módulo Bíblico',bib)+SEC.map(([t,ks])=>tbl(t,ks)+(t==='Jogos de Salão'?duplas():'')).join('')+tbl('Em aberto (prova a definir)',rest)}
function ers(){
 const people={};ROWS.forEach(r=>{(people[r.nome]??=[]).push(r)});
 const hit=n=>people[n].some(filt);
 const out=Object.keys(people).filter(hit).sort((a,b)=>DEL[people[a][0].delegacao][1].localeCompare(DEL[people[b][0].delegacao][1])||people[a][0].nascimento.localeCompare(people[b][0].nascimento));
 return '<div class="grid">'+out.map(n=>{const p=people[n],r0=p[0],d=DEL[r0.delegacao];const a=p.filter(active).length;
  return `<div class="card er"><h3><span class="chip ${d[0]}" style="margin:0 6px 0 0"><i></i>${d[1]}</span>${esc(n)}</h3>
  <div class="m">${esc(r0.categoria)} · ${r0.idade_em_11_10_2026} anos${r0.nascimento?' · '+r0.nascimento.split('-').reverse().join('/'):' (idade informada)'} · ${a} modalidade${a===1?'':'s'} ativa${a===1?'':'s'}</div>
  <ul>${p.filter(filt).map(r=>{const bad=r.situacao==='ATENÇÃO';const nm=r.sigla||r.prova;const lab=r.modulo==='Bíblico'?(r.sigla+' · '+r.competicao):(r.competicao+' · '+r.prova);
   return `<li class="${active(r)?'':'dim'}">${esc(lab)}<span class="badge ${bad?'b-ATENCAO':'b-'+r.papel.split(' ')[0]}">${bad?'atenção':esc(r.papel)}</span>${r.sugestao?`<span class="sug">→ ${esc(r.sugestao)}</span>`:''}${active(r)&&r.observacao&&!r.observacao.startsWith('Idade informada; sem data de nascimento')?`<span class="obs">${esc(r.observacao.replace('Idade informada; sem data de nascimento; ',''))}</span>`:''}</li>`}).join('')}</ul></div>`}).join('')+'</div>'}
function pend(){
 const rs=ROWS.filter(r=>active(r)&&(r.situacao==='PENDENTE'||r.situacao==='ATENÇÃO')&&filt(r));
 if(!rs.length)return '<p class="empty">Nenhuma pendência com esses filtros.</p>';
 return '<table><thead><tr><th>Embaixador do Rei</th><th>Competição</th><th>Situação</th><th>Detalhe / sugestão</th></tr></thead><tbody>'+rs.map(r=>`<tr><td>${chip(r)}</td><td>${esc(r.modulo==='Bíblico'?r.sigla:r.competicao+' · '+r.prova)}<small class="obs">${esc(r.categoria)}</small></td><td><span class="badge ${r.situacao==='ATENÇÃO'?'b-ATENCAO':'b-Em'}" style="margin:0">${r.situacao.toLowerCase()}</span></td><td>${esc(r.observacao.replace('Idade informada; sem data de nascimento; ','').replace('; Idade informada; sem data de nascimento',''))}${r.sugestao?`<span class="sug">→ ${esc(r.sugestao)}</span>`:''}</td></tr>`).join('')+'</tbody></table>'}
function resumo(){
 const people={};ROWS.forEach(r=>{(people[r.nome]??=r)});
 const byDel={};Object.values(people).forEach(r=>byDel[r.delegacao]=(byDel[r.delegacao]||0)+1);
 const fut={};ROWS.filter(r=>r.prova==='Futsal'&&active(r)).forEach(r=>fut[r.categoria]=(fut[r.categoria]||0)+1);
 const vol=ROWS.filter(r=>r.prova==='Vôlei'&&active(r)).length;
 const sup=ROWS.filter(r=>r.papel==='Suplente').length;
 const pend=ROWS.filter(r=>active(r)&&r.situacao==='PENDENTE').length,att=ROWS.filter(r=>active(r)&&r.situacao==='ATENÇÃO').length;
 const c=(n,l,k='')=>`<div class="card ${k}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
 return `<div class="cards">${c(Object.keys(people).length,'Embaixadores do Rei no departamento')}${Object.entries(byDel).map(([d,n])=>c(n,DEL[d][1])).join('')}</div>
 <h2>Equipes</h2><div class="cards">${CATS.map(k=>{const n=fut[k]||0;return c(n+' / 5–10','Futsal '+k,n>=5&&n<=10?'ok':'bad')}).join('')}${c(vol+' / 6–12','Vôlei (categoria única Adolescente/Juvenil)',vol>=6&&vol<=12?'ok':'bad')}</div>
 <h2>Situação</h2><div class="cards">${c(pend,'itens em aberto (pendentes)',pend?'warn':'ok')}${c(att,'itens com atenção (regra violada)',att?'bad':'ok')}${c(sup,'inscrições como suplente')}</div>
 <p class="empty">Futsal Júnior abaixo do mínimo: precisa de um quinto Júnior ou jogar no Adolescente (arts. 19 e 31). Passe o mouse sobre um nome para ver detalhes.</p>`}
const TABS=[['resumo','Resumo'],['comp','Por competição'],['er','Por Embaixador do Rei'],['pend','Pendências']];
function render(){
 document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button aria-pressed="${state.tab===k}" data-t="${k}">${l}</button>`).join('');
 const f=document.getElementById('filters');
 f.style.display=state.tab==='resumo'?'none':'flex';
 f.innerHTML=`<label>Delegação <select data-f="del"><option value="">Todas</option>${Object.entries(DEL).map(([k,v])=>`<option value="${esc(k)}" ${state.del===k?'selected':''}>${v[1]}</option>`).join('')}</select></label>
  <label>Categoria <select data-f="cat"><option value="">Todas</option>${CATS.map(c=>`<option ${state.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
  <label>Papel <select data-f="papel"><option value="">Todos</option>${['Titular','Suplente','Em aberto','Descartado','Removido'].map(c=>`<option ${state.papel===c?'selected':''}>${c}</option>`).join('')}</select></label>
  <input data-f="q" placeholder="Buscar nome ou prova" value="${esc(state.q)}">`;
 document.getElementById('view').innerHTML={resumo,comp,er:ers,pend}[state.tab]();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){state.tab=t.dataset.t;render()}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f&&f!=='q'){state[f]=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.f==='q'){state.q=e.target.value;const p=e.target.selectionStart;render();const i=document.querySelector('[data-f=q]');i.focus();i.setSelectionRange(p,p)}});
render();
</script></body></html>
